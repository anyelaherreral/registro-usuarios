name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RegistroUsuarios
    steps:
      - uses: actions/checkout@v4

      # gradle-daemon-jvm.properties pide JDK 25
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # The runner already ships the Android SDK; just accept licenses so Gradle can fetch compileSdk 37
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: registro-usuarios-debug-apk
          path: RegistroUsuarios/app/build/outputs/apk/debug/*.apk
